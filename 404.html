  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #FAFAF8;
      font-family: 'Inter', sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 24px;
    }
    img.pin { width: 180px; height: auto; margin-bottom: 8px; }
    .code { font: 500 15px/1 'Inter', sans-serif; letter-spacing: 0.3em; color: #C77E5C; margin-bottom: 14px; }
    h1 { font: 600 42px/1.15 'Playfair Display', serif; color: #2C2C2C; margin-bottom: 12px; }

    p.ar { font-size: 16px; direction: rtl; margin-top: 6px; }
    a.home {
      display: inline-block; margin-top: 28px;
      padding: 13px 34px; border-radius: 999px;
      background: #C77E5C; color: #fff; text-decoration: none;
      font: 500 15px/1 'Inter', sans-serif; letter-spacing: 0.04em;
      transition: background 0.2s;
    }
    a.home:hover { background: #B0693F; }
    .strip { position: fixed; left: 0; right: 0; bottom: 0; height: 14px; display: flex; gap: 3px; padding: 0 3px; align-items: flex-end; }
    .strip span { flex: 1; height: 10px; border-radius: 2px; }
    .strip span:nth-child(6n+1) { background: #C77E5C; height: 12px; }
    .strip span:nth-child(6n+2) { background: #D4A574; height: 9px; }
    .strip span:nth-child(6n+3) { background: #B0693F; height: 11px; }
    .strip span:nth-child(6n+4) { background: #E3C9A8; height: 8px; }
    .strip span:nth-child(6n+5) { background: #9C5A38; height: 10px; }
    .strip span:nth-child(6n+6) { background: #D9B183; height: 9px; }
  </style>
</head>
